<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KiraOS</title>
<style>
:root{--fondo:#05070f;--panel:rgba(12,17,31,.97);--borde:rgba(130,170,230,.16);--texto:#e7ecf5;--tenue:#8b98b3;
  --cian:#22d3ee;--rosa:#f472d0;--barra:56px}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Segoe UI","Noto Sans","DejaVu Sans",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--fondo);color:var(--texto)}
input{-webkit-user-select:text;user-select:text}
img,svg,a{-webkit-user-drag:none;user-drag:none}
svg{display:block}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ---------- fondo ---------- */
#fondo{position:fixed;inset:0;background:radial-gradient(1100px 700px at 72% 38%,#0d1730 0%,#070b17 52%,#04050b 100%)}
#fondo .orbe{position:absolute;right:9vw;top:13vh;width:min(38vmin,330px);height:min(38vmin,330px);border-radius:50%;
  opacity:.82;background:radial-gradient(circle at 50% 42%,#14223d 0%,#0a1020 70%);
  box-shadow:0 0 0 2px rgba(34,211,238,.28),0 0 60px rgba(34,211,238,.16),0 0 90px rgba(244,114,208,.12);
  animation:late 6s ease-in-out infinite;display:grid;place-items:center}
#fondo .orbe b{font-size:min(5vmin,40px);font-weight:800;letter-spacing:3px;background:linear-gradient(100deg,#2ee6ff,#f472d0);
  -webkit-background-clip:text;background-clip:text;color:transparent}
#fondo .anillo{position:absolute;inset:-14px;border-radius:50%;border:2px solid transparent;
  border-top-color:rgba(34,211,238,.55);border-right-color:rgba(244,114,208,.35);animation:gira 14s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#fondo .orbe .centro{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:0 12%}
#fondo .orbe .modo{font-size:min(3.4vmin,26px);font-weight:600;color:#e9f6ff;letter-spacing:.5px}
#fondo .orbe .eta{font-size:min(2.2vmin,16px);color:#9ff1ff;min-height:1.2em}
#fondo .orbe{cursor:pointer;z-index:2}
#fondo .orbe:hover{opacity:.95;box-shadow:0 0 0 2px rgba(34,211,238,.5),0 0 70px rgba(34,211,238,.25),0 0 100px rgba(244,114,208,.18)}
#fondo .orbe.ocupada .modo{color:#fff;text-shadow:0 0 14px rgba(46,230,255,.6)}
@keyframes late{0%,100%{transform:scale(1)}50%{transform:scale(1.012)}}
#saludo{position:fixed;right:9vw;top:calc(13vh + min(38vmin,330px) + 30px);width:min(38vmin,330px);text-align:center}
#saludo .hora{font-size:46px;font-weight:300;letter-spacing:1px}
#saludo .dia{color:var(--tenue);font-size:15px;margin-top:2px}
#saludo .hola{margin-top:16px;font-size:16px}
#saludo .hola b{background:linear-gradient(100deg,#2ee6ff,#f472d0);-webkit-background-clip:text;background-clip:text;color:transparent}
#saludo .pista{color:var(--tenue);font-size:13px;margin-top:6px;line-height:1.45}
#saludo .version{margin-top:12px;font-size:12.5px;color:#7fd8ea;letter-spacing:.3px}
#saludo .version.aviso{color:#ffb3e6;background:rgba(244,114,208,.12);border:1px solid rgba(244,114,208,.35);border-radius:10px;padding:7px 10px;line-height:1.4}
/* v3.17: la terminal */
.term{display:flex;flex-direction:column;height:100%;gap:10px}
.term pre{flex:1;margin:0;background:#020409;border:1px solid #17304a;border-radius:10px;padding:12px 14px;overflow:auto;
  font:13.5px/1.45 "DejaVu Sans Mono","Consolas",monospace;color:#cfe8ff;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text}
.term .linea{display:flex;gap:8px;align-items:center}
.term .linea span{font:13.5px "DejaVu Sans Mono",monospace;color:#2ee6ff}
.term .linea input{flex:1;background:#06101e;border:1px solid #1d4060;border-radius:9px;padding:10px 12px;color:#e9f6ff;
  font:14px "DejaVu Sans Mono","Consolas",monospace;outline:none}
.term .linea input.secreto{border-color:#f472d0;-webkit-text-security:disc}
.term .teclas{display:flex;flex-wrap:wrap;gap:6px}
.term .teclas button{background:#0d1b30;border:1px solid #1d4060;border-radius:7px;padding:6px 11px;font:13px "DejaVu Sans Mono",monospace;color:#cfe8ff}
.term .teclas button.acc{color:#ffd28a}
.term .nota{font-size:12px;color:var(--tenue)}

/* ---------- iconos del escritorio ---------- */
#iconos{position:fixed;left:42px;top:38px;display:grid;grid-template-columns:repeat(3,128px);gap:22px 16px}
#iconos{max-height:calc(100vh - 120px);overflow-y:auto}
#iconos.c4{grid-template-columns:repeat(4,128px)}#iconos.c5{grid-template-columns:repeat(5,128px)}
.icono{display:flex;flex-direction:column;align-items:center;gap:9px;padding:12px 6px;border-radius:14px;cursor:pointer;
  transition:background .15s}
.icono:hover,.icono:focus{background:rgba(120,170,240,.08);outline:none}
.icono .tile{width:64px;height:64px;border-radius:18px;display:grid;place-items:center;position:relative;
  background:linear-gradient(160deg,rgba(26,38,66,.95),rgba(12,18,34,.95));
  box-shadow:inset 0 0 0 1px rgba(130,170,230,.18),0 8px 22px rgba(0,0,0,.35)}
.icono .tile::after{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;
  background:linear-gradient(140deg,rgba(34,211,238,.6),rgba(244,114,208,.45));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.icono svg{width:30px;height:30px;stroke:#7fe8ff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.icono span{font-size:13.5px;text-align:center;line-height:1.2;text-shadow:0 1px 3px #000}
.icono small{display:block;color:var(--tenue);font-size:11px;margin-top:2px}

/* ---------- ventana ---------- */
#ventana{position:fixed;left:4vw;right:4vw;top:22px;bottom:calc(var(--barra) + 18px);display:none;flex-direction:column;
  background:var(--panel);border:1px solid var(--borde);border-radius:16px;backdrop-filter:blur(14px);
  box-shadow:0 30px 70px rgba(0,0,0,.55);overflow:hidden;animation:aparece .18s ease-out}
#ventana.on{display:flex}
@keyframes aparece{from{opacity:0;transform:translateY(10px) scale(.99)}}
.vcab{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--borde);
  background:rgba(8,12,24,.6)}
.volver{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:rgba(34,211,238,.12);
  color:#9ff1ff;font-size:14px;font-weight:600;box-shadow:inset 0 0 0 1px rgba(34,211,238,.3)}
.volver:hover{background:rgba(34,211,238,.2)}
.vcab h2{flex:1;font-size:16px;font-weight:600;letter-spacing:.3px}
.vextras{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vextras button{background:rgba(46,230,255,.10);border:1px solid rgba(46,230,255,.35);border-radius:8px;padding:5px 10px;font-size:12.5px;color:#bff5ff}
.vextras button:hover{background:rgba(46,230,255,.2)}
.nota-extra{margin-top:14px;font-size:12px;color:var(--tenue);line-height:1.45}
.cerrar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tenue)}
.cerrar:hover{background:rgba(244,114,208,.18);color:#fff}
.vcuerpo{flex:1;overflow:auto;padding:20px 24px;-webkit-user-select:text;user-select:text}
.vcuerpo.marco{padding:0;overflow:hidden;display:flex;flex-direction:column}
.vcuerpo iframe{width:100%;height:100%;flex:1;border:0;background:#05070f}
.appbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#0b1020;border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;color:#aab3c5}
.appbar button{padding:5px 12px;border-radius:8px;border:0;cursor:pointer;background:#1a2133;color:#e7ecf5}
.appbar button.peligro{background:#3a1420;color:#ffc2cc;box-shadow:inset 0 0 0 1px rgba(251,113,133,.5)}
.ctxmenu{position:fixed;z-index:9999;min-width:170px;background:#0d1326;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.ctxmenu .ctxtit{font-size:12px;color:#8a93a6;padding:4px 8px 6px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.ctxmenu button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;border-radius:7px;background:transparent;color:#e7ecf5;cursor:pointer;font-size:14px}
.ctxmenu button:hover{background:#1a2133}
.ctxmenu button.peligro{color:#ffc2cc}
/* v3.23: las salas POR DENTRO (lo que tú le pides: letra, color, tamaño, botones, notas y tarjetas de Kira) */
#ventana.t-pequena{left:18vw;right:18vw;top:9vh;bottom:calc(var(--barra) + 9vh)}
#ventana.t-grande{left:1.2vw;right:1.2vw;top:8px;bottom:calc(var(--barra) + 8px)}
#ventana.t-completa{left:0;right:0;top:0;bottom:var(--barra);border-radius:0}
.vcuerpo.l-pequena{zoom:.88}.vcuerpo.l-grande{zoom:1.18}.vcuerpo.l-enorme{zoom:1.4}
.nota-sala,.tarjeta-extra{margin:0 0 14px;padding:12px 14px;border-radius:12px;background:rgba(34,211,238,.07);
  border:1px solid var(--borde);white-space:pre-wrap;line-height:1.5;font-size:14px}
.vcuerpo.marco .nota-sala,.vcuerpo.marco .tarjeta-extra{margin:10px 12px}
.nota-sala{border-left:3px solid var(--rosa)}
.tarjeta-extra h4{margin:0 0 6px;font-size:14px;color:var(--cian)}
.tarjeta-extra.abajo{margin:14px 0 0}
.tarjeta-extra .botones{margin-top:10px}
.texto{white-space:pre-wrap;line-height:1.55;font-size:15px;color:#d8e0ee}
.botones{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.b{padding:9px 16px;border-radius:10px;background:rgba(130,170,230,.1);box-shadow:inset 0 0 0 1px var(--borde);font-size:14px}
.b:hover{background:rgba(130,170,230,.18)}
.b.prin{background:linear-gradient(100deg,#0ea5c7,#2563eb);box-shadow:none;color:#fff}
.b.aviso{background:#e11d74;color:#fff;box-shadow:none}
.b.peligro{box-shadow:inset 0 0 0 1px rgba(251,113,133,.5);color:#ffc2cc}
.resultado{margin-top:16px;padding:12px 14px;border-radius:10px;background:rgba(5,8,16,.6);box-shadow:inset 0 0 0 1px var(--borde);
  white-space:pre-wrap;line-height:1.5;font-size:14px;display:none}
.resultado.on{display:block}

/* wifi */
.redes{margin-top:14px;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--borde)}
.red{display:flex;align-items:center;gap:14px;padding:12px 16px;cursor:pointer;border-bottom:1px solid rgba(130,170,230,.08)}
.red:hover{background:rgba(130,170,230,.07)}.red.sel{background:rgba(34,211,238,.12)}
.red .n{flex:1;font-size:15px}.red .d{color:var(--tenue);font-size:13px}
.red .uso{color:var(--cian);font-size:12px;font-weight:700;letter-spacing:.5px}
.barras{display:flex;align-items:flex-end;gap:2px;height:16px}.barras i{width:4px;border-radius:1px;background:rgba(160,180,210,.25)}
.barras i.on{background:var(--cian)}
.clave{display:none;gap:10px;margin-top:14px;align-items:center}.clave.on{display:flex}
.campo{flex:1;max-width:340px;padding:10px 12px;border-radius:10px;border:0;background:rgba(5,8,16,.8);color:var(--texto);
  font-size:15px;box-shadow:inset 0 0 0 1px var(--borde);outline:none}
.campo:focus{box-shadow:inset 0 0 0 1px var(--cian)}

/* buscador (tipo Google) */
.bus{max-width:860px;margin:0 auto}
.bus .logo{text-align:center;font-size:36px;font-weight:800;letter-spacing:3px;margin:4px 0 16px;
  background:linear-gradient(100deg,#2ee6ff,#f472d0);-webkit-background-clip:text;background-clip:text;color:transparent}
.caja{display:flex;align-items:center;gap:10px;height:50px;padding:0 6px 0 18px;border-radius:25px;background:rgba(5,8,16,.85);
  box-shadow:inset 0 0 0 1px rgba(34,211,238,.38),0 6px 24px rgba(0,0,0,.25)}
.caja:focus-within{box-shadow:inset 0 0 0 1.5px var(--cian),0 6px 24px rgba(34,211,238,.12)}
.caja input{flex:1;background:none;border:0;outline:none;color:var(--texto);font-size:16px}
.caja svg{width:20px;height:20px;stroke:#7fe8ff;fill:none;stroke-width:1.9;stroke-linecap:round}
.caja .b{border-radius:20px}
.pestanas{display:flex;gap:4px;margin:14px 6px 0;border-bottom:1px solid var(--borde)}
.secc{margin:0 0 18px}
.secc h4{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:#9ff1ff}
.fila{display:flex;gap:12px;align-items:center;padding:10px 12px;margin:0 0 6px;border-radius:12px;background:rgba(130,170,230,.06);box-shadow:inset 0 0 0 1px var(--borde)}
.ftxt{flex:1;min-width:0}.ftit{font-size:14.5px;color:#e9f1fb;overflow-wrap:anywhere}
.fdet{font-size:12.5px;color:var(--tenue);margin-top:3px;overflow-wrap:anywhere}
.fbot{display:flex;gap:6px;flex:0 0 auto}
.b.mini{padding:6px 11px;font-size:12.5px}.b.mini.off{opacity:.3;cursor:default}
.vacia{font-size:13px;color:var(--tenue);padding:4px 2px}
.etq{display:inline-block;margin-top:4px;padding:2px 8px;border-radius:8px;font-size:11.5px;font-weight:600}
.etq.ok{background:rgba(52,211,153,.18);color:#6ee7b7}.etq.mej{background:rgba(34,211,238,.16);color:#9ff1ff}
.etq.mal{background:rgba(248,113,113,.18);color:#fca5a5}.etq.perm{background:rgba(244,114,208,.18);color:#f9a8d4}
.etq.gris{background:rgba(148,163,184,.16);color:#cbd5e1}.etq.hecho{background:rgba(130,170,230,.14);color:#c7d7f0}
.pestapp{margin:0 0 14px;flex-wrap:wrap;position:sticky;top:-20px;background:var(--panel);z-index:2;padding-top:4px}
.pest{padding:8px 14px;font-size:13.5px;color:var(--tenue);border-bottom:2px solid transparent;margin-bottom:-1px}
.pest.on{color:#9ff1ff;border-bottom-color:var(--cian)}
.via{color:var(--tenue);font-size:12.5px;margin:10px 6px 8px}
.res{padding:12px 6px 14px;border-bottom:1px solid rgba(130,170,230,.07)}
.res .dom{font-size:12.5px;color:#7fd6a8}
.res .tit{display:block;font-size:17.5px;color:#8ab4f8;margin:3px 0 4px;text-align:left;line-height:1.3}
.res .tit:hover{text-decoration:underline}
.res .sum{font-size:14px;color:#c3cbdb;line-height:1.5}
.lectura h3{font-size:21px;font-weight:600;margin:14px 0 4px;line-height:1.3}
.lectura .dom{color:#7fd6a8;font-size:12.5px;margin-bottom:14px;word-break:break-all}
.enlaces{margin:22px 0 8px;border-top:1px solid rgba(130,170,230,.12);padding-top:12px}
.enlaces .cab{font-size:15px;font-weight:600;color:#9ff1ff;margin-bottom:6px}
.enlaces .sub{font-size:12.5px;color:var(--tenue);margin:10px 0 4px}
.enl{display:block;text-align:left;color:#8ab4f8;font-size:14.5px;padding:5px 2px;line-height:1.35}
.enl:hover{text-decoration:underline}
.enl.tema::before{content:"› ";color:#7fd6a8}

/* conversación (en la ventana «Hablar» y en el cajón de texto) */
.charla{display:flex;flex-direction:column;gap:10px}
.m{max-width:82%;padding:10px 14px;border-radius:14px;line-height:1.5;font-size:15px;white-space:pre-wrap;
  -webkit-user-select:text;user-select:text}
.m.tu{align-self:flex-end;background:rgba(34,211,238,.14);box-shadow:inset 0 0 0 1px rgba(34,211,238,.25);border-bottom-right-radius:4px}
.m.kira{align-self:flex-start;background:rgba(244,114,208,.09);box-shadow:inset 0 0 0 1px rgba(244,114,208,.2);border-bottom-left-radius:4px}
.m.kira .q{color:var(--tenue);font-size:12px;margin-bottom:3px;font-weight:600;letter-spacing:.4px}
.m.kira .sis{display:block;color:#a8b5cc;font-size:13.5px;margin-top:6px}
.vacio{color:var(--tenue);font-size:14px;line-height:1.5}

#cajon{position:fixed;right:14px;bottom:calc(var(--barra) + 12px);width:min(440px,92vw);height:min(56vh,480px);display:none;
  flex-direction:column;background:var(--panel);border:1px solid var(--borde);border-radius:16px;backdrop-filter:blur(14px);
  box-shadow:0 24px 60px rgba(0,0,0,.55);overflow:hidden;z-index:30;animation:aparece .18s ease-out}
#cajon.on{display:flex}
#cajon .ccab{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--borde);font-size:14px;font-weight:600;gap:8px}
#cajon .ccab span{flex:1}
#cajon .ccuerpo{flex:1;overflow:auto;padding:14px}

/* ---------- menú KIRA (como Inicio) ---------- */
#menu{position:fixed;left:10px;bottom:calc(var(--barra) + 10px);width:320px;display:none;flex-direction:column;padding:12px;
  background:var(--panel);border:1px solid var(--borde);border-radius:16px;backdrop-filter:blur(14px);
  box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:40;animation:aparece .16s ease-out}
#menu.on{display:flex}
#menu .quien{display:flex;align-items:center;gap:10px;padding:6px 8px 12px;border-bottom:1px solid var(--borde);margin-bottom:6px}
#menu .quien .mini{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;
  background:radial-gradient(circle at 50% 40%,#16243f,#0a1020);box-shadow:0 0 0 1.5px rgba(34,211,238,.5)}
#menu .op{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;font-size:14px;cursor:pointer}
#menu .op:hover{background:rgba(130,170,230,.1)}
#menu .op svg{width:20px;height:20px;stroke:#7fe8ff;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#menu .sep{height:1px;background:var(--borde);margin:6px 4px}
#menu .op.peligro svg{stroke:#ff9fb0}

/* ---------- la barra de abajo ---------- */
#barra{position:fixed;left:0;right:0;bottom:0;height:var(--barra);display:flex;align-items:center;gap:10px;padding:0 10px;
  background:rgba(7,10,20,.88);border-top:1px solid var(--borde);backdrop-filter:blur(16px);z-index:50}
#btnKira{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px;
  background:radial-gradient(circle at 50% 38%,#18284a,#0a1020);box-shadow:inset 0 0 0 1.5px rgba(34,211,238,.55),0 0 16px rgba(34,211,238,.18)}
#btnKira b{background:linear-gradient(100deg,#2ee6ff,#f472d0);-webkit-background-clip:text;background-clip:text;color:transparent}
#btnKira.on{box-shadow:inset 0 0 0 1.5px #f472d0,0 0 18px rgba(244,114,208,.3)}
#abiertas{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:7px;height:38px;padding:0 12px;border-radius:10px;font-size:13px;
  background:rgba(130,170,230,.1);box-shadow:inset 0 -2px 0 var(--cian)}
.chip svg{width:16px;height:16px;stroke:#7fe8ff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#habla{flex:1;max-width:620px;margin:0 auto;display:flex;align-items:center;gap:6px;height:42px;padding:0 6px 0 14px;border-radius:21px;
  background:rgba(14,20,36,.95);box-shadow:inset 0 0 0 1px rgba(34,211,238,.35),0 0 18px rgba(34,211,238,.08)}
#habla input{flex:1;background:none;border:0;outline:none;color:var(--texto);font-size:15px}
#habla input::placeholder{color:#6f7d98}
.redondo{width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.redondo svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#mic{color:#9ff1ff;background:rgba(34,211,238,.14)}
#mic.oye{background:#f472d0;color:#0b0f1c;animation:pulso 1.1s ease-in-out infinite}
@keyframes pulso{50%{box-shadow:0 0 0 8px rgba(244,114,208,.18)}}
#enviar{color:#0b0f1c;background:linear-gradient(120deg,#2ee6ff,#7dd3fc)}
.bb{height:38px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:7px;font-size:13px;color:#cbd5e1}
.bb:hover{background:rgba(130,170,230,.1)}
.bb svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bb.on{background:rgba(34,211,238,.14);color:#9ff1ff}
#btnTexto{position:relative}
#btnTexto .punto{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--rosa);display:none}
#btnTexto.nuevo .punto{display:block}
#wifi .barras{height:14px}
#reloj{font-size:13px;color:#cbd5e1;text-align:right;line-height:1.2;padding:0 6px;min-width:66px}
#reloj small{display:block;color:var(--tenue);font-size:11px}

/* aviso flotante (pensando / hablando / escuchando) */
#aviso{position:fixed;left:50%;bottom:calc(var(--barra) + 14px);transform:translateX(-50%);display:none;align-items:center;gap:10px;
  padding:9px 16px;border-radius:20px;background:rgba(14,20,36,.95);box-shadow:inset 0 0 0 1px var(--borde),0 10px 30px rgba(0,0,0,.4);
  font-size:13.5px;z-index:45;max-width:min(640px,90vw)}
#aviso.on{display:flex}
#aviso .puntos{display:flex;gap:4px}
#aviso .puntos i{width:6px;height:6px;border-radius:50%;background:var(--cian);animation:salta 1s ease-in-out infinite}
#aviso .puntos i:nth-child(2){animation-delay:.15s;background:#7dd3fc}#aviso .puntos i:nth-child(3){animation-delay:.3s;background:var(--rosa)}
@keyframes salta{50%{transform:translateY(-4px);opacity:.6}}
#aviso a{color:#9ff1ff;cursor:pointer;text-decoration:underline}
/* indicador de OCUPADA / COLA en la barra (v2.95) */
#trabajo{display:none;align-items:center;gap:8px;max-width:40vw;padding:0 10px;height:38px;border-radius:12px;
  background:rgba(34,211,238,.10);box-shadow:inset 0 0 0 1px rgba(34,211,238,.35);font-size:12.5px}
#trabajo.on{display:flex}
#trabajo.pausa{background:rgba(244,114,208,.10);box-shadow:inset 0 0 0 1px rgba(244,114,208,.35)}
#trabajo .punto{width:9px;height:9px;border-radius:50%;background:var(--cian);flex:0 0 auto;animation:latir 1.2s ease-in-out infinite}
#trabajo.pausa .punto{background:var(--rosa);animation:none}
#trabajo.libre{background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--borde)}
#trabajo.libre .punto{background:#5b6b86;animation:none}
#trabajo .qué{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
#trabajo .cuantas{color:#9ff1ff;flex:0 0 auto}
#trabajo button{flex:0 0 auto;height:26px;padding:0 10px;border-radius:8px;border:0;cursor:pointer;font-size:12px;
  background:rgba(255,255,255,.08);color:#eaf2ff}
#trabajo button:hover{background:rgba(255,255,255,.16)}
#trabajo button.parar{background:rgba(244,114,208,.22)}
@keyframes latir{50%{opacity:.35}}
/* v3.21: SALVAPANTALLAS (lo eliges con una frase: orbe, estrellas, reloj, negro) */
#salva{position:fixed;inset:0;z-index:9000;background:#000;display:none;cursor:none;overflow:hidden}
#salva.on{display:block}
#salva canvas{position:absolute;inset:0;width:100%;height:100%}
#salva .sorbe{position:absolute;width:30vmin;height:30vmin;border-radius:50%;display:grid;place-items:center;
  border:2px solid var(--cian);box-shadow:0 0 60px var(--cian),inset 0 0 40px var(--rosa);color:var(--texto);
  font-size:5vmin;font-weight:700;letter-spacing:.3em;animation:slate 4s ease-in-out infinite;transition:left 6s ease,top 6s ease}
#salva .sreloj{position:absolute;color:var(--texto);font-size:16vmin;font-weight:200;text-shadow:0 0 30px var(--cian);
  transition:left 8s ease,top 8s ease;text-align:center}
#salva .sreloj small{display:block;font-size:3.4vmin;color:var(--tenue);font-weight:400}
@keyframes slate{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.06);opacity:1}}
</style>

  </div>
  <div class="vcuerpo" id="vcuerpo"></div>
</div>

<div id="cajon"><div class="ccab"><span>Conversación con Kira</span>
  <button class="cerrar" id="cajonCerrar" title="Ocultar texto"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

<div id="menu"></div>
<div id="aviso"></div>
<div id="salva"></div>

<div id="barra">

  <div id="habla">
    <input id="entrada" maxlength="600" autocomplete="off" spellcheck="false" placeholder="Habla con Kira… escribe o pulsa el micrófono">
    <button class="redondo" id="mic" title="Hablar (micrófono)"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>

  </div>

  <button class="bb on" id="btnVoz" title="Kira contesta con su voz"><svg viewBox="0 0 24 24" id="icoVoz"></svg></button>
  <div id="trabajo">
    <span class="punto"></span>
    <span class="qué" id="trabQué"></span>
    <span class="cuantas" id="trabCuantas"></span>
    <button class="parar" id="trabParar" title="Para lo que está haciendo ahora">Parar</button>
    <button id="trabPausar" title="Pausar / seguir">Pausar</button>
  </div>
  <button class="bb" id="wifi" title="WiFi"><span class="barras" id="wifiBarras"></span><span id="wifiNombre">WiFi</span></button>
  <div id="reloj"></div>
</div>

    var sel=pestApp[id];

    pestApp[id]=sel;

      setTimeout(function(){ if(b.dataset.armado){ delete b.dataset.armado; b.textContent=b.dataset.antes; b.classList.remove("aviso"); } }, 5000);

        .catch(function(){ if(actual===id) relojApp=setTimeout(toca, cada); });

function pintaTerminalIntegrada(){                   // la terminal embebida (v3.17), de reserva o a elección
  var c=$("vcuerpo");
  c.innerHTML='<div class="term"><pre id="termSal"></pre>'+
    '<div class="linea"><span id="termPrompt">$</span><input id="termIn" autocomplete="off" spellcheck="false" placeholder="escribe una orden de Linux y pulsa Intro"></div>'+
    '<div class="teclas">'+TECLAS.map(function(k){ return '<button data-k="'+esc(k)+'">'+esc(k)+'</button>'; }).join("")+
    '<button class="acc" data-t="ctrl_c">Ctrl+C</button><button class="acc" data-t="tab">Tab</button><button class="acc" data-x="limpiar">Limpiar</button><button class="acc" data-x="nueva">Nueva</button></div>'+
    '<div class="nota">Es una terminal de verdad con tu usuario: lo que escribes lo ejecuta Linux. Programas a pantalla completa (nano, top) se ven mal aquí: usa la terminal de Xubuntu para eso. Los botones de arriba escriben los signos que le faltan a tu teclado.</div></div>';
  var inp=$("termIn"), sal=$("termSal"); term.pos=0; sal.textContent="";
  [].forEach.call(c.querySelectorAll("[data-k]"), function(b){ b.onclick=function(){
    var i=inp.selectionStart||inp.value.length; inp.value=inp.value.slice(0,i)+b.dataset.k+inp.value.slice(inp.selectionEnd||i);
    inp.focus(); inp.selectionStart=inp.selectionEnd=i+b.dataset.k.length; }; });
  [].forEach.call(c.querySelectorAll("[data-t]"), function(b){ b.onclick=function(){

  [].forEach.call(c.querySelectorAll("[data-x]"), function(b){ b.onclick=function(){
    if(b.dataset.x==="limpiar"){ llama("terminal_limpiar").then(function(){ sal.textContent=""; inp.focus(); }); return; }
    llama("terminal_nueva").then(function(d){ term.pos=0; sal.textContent=""; pintaTerm(d); inp.focus(); }); }; });
  inp.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ var v=inp.value; inp.value="";
      if(!term.clave && v.trim()){ term.hist.push(v); if(term.hist.length>200) term.hist.shift(); }
      term.h=-1; llama("terminal_escribir", v, term.clave).then(function(){ setTimeout(leeTerm, 120); }); e.preventDefault(); return; }
    if(e.key==="ArrowUp" && term.hist.length && !term.clave){ term.h = term.h<0 ? term.hist.length-1 : Math.max(0, term.h-1); inp.value=term.hist[term.h]; e.preventDefault(); return; }
    if(e.key==="ArrowDown" && term.h>=0){ term.h++; if(term.h>=term.hist.length){ term.h=-1; inp.value=""; } else inp.value=term.hist[term.h]; e.preventDefault(); return; }
    if(e.key==="Tab"){ e.preventDefault(); completar(inp); return; }
    if(e.ctrlKey && (e.key==="c"||e.key==="C") && inp.selectionStart===inp.selectionEnd){ e.preventDefault();

    if(e.ctrlKey && (e.key==="l"||e.key==="L")){ e.preventDefault(); llama("terminal_limpiar").then(function(){ sal.textContent=""; }); }
  });
  llama("terminal_abrir").then(function(d){ pintaTerm(d); inp.focus(); term.reloj=setTimeout(leeTerm, 400); })
    .catch(function(){ sal.textContent="No he podido abrir la terminal."; });

function completar(inp){                          // Tab: completa nombres de archivos con «compgen» (sin readline)

    inp.focus(); }).catch(function(){ inp.focus(); });

function pintaTerm(d){

  var abajo=s.scrollTop+s.clientHeight>=s.scrollHeight-40;

function leeTerm(){

  busq.pila=[]; leerUrl(r.url, r.dominio);
}
function htmlEnlaces(p){
  var l=p.enlaces||[]; if(!l.length) return "";
  var tema=l.filter(function(e){return e.tema;}), otros=l.filter(function(e){return !e.tema;});
  function fila(e){ return '<button class="enl'+(e.tema?' tema':'')+'" data-u="'+esc(e.url)+'">'+esc(e.texto)+'</button>'; }
  return '<div class="enlaces"><div class="cab">Enlaces de esta página'+(p.total_enlaces?' ('+p.total_enlaces+')':'')+'</div>'+
    (tema.length?'<div class="sub">Del mismo tema</div>'+tema.map(fila).join(""):'')+
    (otros.length?'<div class="sub">Otros</div>'+otros.map(fila).join(""):'')+'</div>';
}
function leerUrl(url, dom){
  var b=$("busCuerpo"); if(!b) return;
  b.innerHTML='<div class="vacio" style="margin-top:16px">Leyendo '+esc(dom||url)+' desde mi máquina…</div>';
  llama("leer_web", url).then(function(p){
    var atras='<button class="b" id="busAtras">'+(busq.pila&&busq.pila.length?'‹ Atrás':'‹ Resultados')+'</button>';
    if(!p.ok){ b.innerHTML='<div class="botones">'+atras+'</div><div class="texto" style="margin-top:14px">'+esc(p.error||"No he podido leerla.")+'</div>'; }
    else {
      b.innerHTML='<div class="botones">'+atras+'<button class="b prin" id="busResume">Resúmelo</button>'+
        '<button class="b" id="busGuarda">Guárdalo en mi baúl</button>'+
        ((p.enlaces||[]).length?'<button class="b" id="busEnlaces">Estúdiala entera (todos sus enlaces)</button>':'')+'</div>'+
        '<div class="lectura"><h3>'+esc(p.titulo)+'</h3><div class="dom">'+esc(p.url)+' · '+esc(p.via)+
        (p.codigos?' · '+p.codigos+' bloque(s) de código':'')+'</div><div class="texto">'+esc(p.texto)+'</div></div>'+htmlEnlaces(p);
      $("busResume").onclick=function(){ enviar("resume "+p.url); };
      $("busGuarda").onclick=function(){ enviar("guarda "+p.url); };
      if($("busEnlaces")) $("busEnlaces").onclick=function(){ enviar("estudia esta página y sus enlaces: "+p.url); };
      [].forEach.call(b.querySelectorAll(".enl"), function(e){ e.onclick=function(){
        busq.pila=busq.pila||[]; busq.pila.push([p.url, p.dominio]); leerUrl(e.dataset.u, ""); }; });
    }
    $("busAtras").onclick=function(){
      var antes=busq.pila&&busq.pila.length?busq.pila.pop():null;
      if(antes) leerUrl(antes[0], antes[1]); else pintaResultados();
      $("vcuerpo").scrollTop=0; };
    $("vcuerpo").scrollTop=0;
  }).catch(function(){ b.innerHTML='<div class="texto">No he podido leerla.</div>'; });
}

// ---------- HABLAR CON KIRA, desde cualquier sitio ----------
var mensajes=[], vozOn=true, ocupada=false;
function pintaHablar(){
  var c=$("vcuerpo");
  c.innerHTML='<div class="charla" id="charlaVentana"></div>';
  pintaCharla();
}
function htmlCharla(){
  if(!mensajes.length) return '<div class="vacio">Aún no hemos hablado. Escríbeme abajo o pulsa el micrófono: te contesto con mi voz, y aquí tienes el texto.</div>';
  return mensajes.map(function(m){
    if(m.quien==="tu") return '<div class="m tu">'+esc(m.texto)+'</div>';
    return '<div class="m kira"><div class="q">KIRA</div>'+esc(m.texto||"…")+(m.lineas&&m.lineas.length?'<span class="sis">'+esc(m.lineas.join("\n"))+'</span>':'')+'</div>';
  }).join("");
}
function pintaCharla(){
  var h=htmlCharla();
  ["charlaCajon","charlaVentana"].forEach(function(id){ var el=$(id); if(!el) return; el.innerHTML=h;
    var sc=el.parentNode; sc.scrollTop=sc.scrollHeight; });
}
function aviso(html, segundos){
  var a=$("aviso"); a.innerHTML=html; a.classList.add("on");
  clearTimeout(aviso.t); if(segundos) aviso.t=setTimeout(function(){ a.classList.remove("on"); }, segundos*1000);
}
function quitaAviso(){ $("aviso").classList.remove("on"); }
var PUNTOS='<span class="puntos"><i></i><i></i><i></i></span>';
function enviar(texto){
  texto=String(texto||"").trim(); if(!texto) return;
  $("entrada").value="";
  // «busca …» (escrito o dicho) abre el BUSCADOR con los resultados
  llama("es_busqueda", texto).then(function(b){
    if(b && b.consulta){ abrir("buscador", b.consulta, b.tipo); return; }
    hablarCon(texto);
  }).catch(function(){ hablarCon(texto); });
}
function hablarCon(texto){
  mensajes.push({quien:"tu",texto:texto}); var m={quien:"kira",texto:"",lineas:[]}; mensajes.push(m); pintaCharla();
  ocupada=true; aviso(PUNTOS+"Kira está pensando…");
  llama("hablar", texto).then(function(r){
    if(!r||!r.id){ m.texto="No he podido empezar a contestarte."; ocupada=false; pintaCharla(); quitaAviso(); return; }
    var t=setInterval(function(){
      llama("tarea_hablar", r.id).then(function(d){
        m.texto=d.respuesta||""; m.lineas=d.lineas||[]; pintaCharla();
        if(d.estado==="hecho" || d.estado==="no existe"){
          clearInterval(t); ocupada=false;
          var todo=(m.texto+" "+m.lineas.join(" ")).trim();
          if(!$("cajon").classList.contains("on") && actual!=="hablar") $("btnTexto").classList.add("nuevo");
          if(vozOn) aviso(PUNTOS+'Kira te está contestando con su voz · <a id="verTexto">ver texto</a> · <a id="callar">callar</a>',
                         Math.min(40, 3+todo.length/14));
          else aviso('Kira te ha contestado · <a id="verTexto">ver texto</a>', 8);
          var vt=$("verTexto"); if(vt) vt.onclick=function(){ abreCajon(true); quitaAviso(); };
          var ca=$("callar"); if(ca) ca.onclick=function(){ llama("callar"); quitaAviso(); };
          if(d.pedir_clave){ abrir("wifi"); }
          if(d.aspecto) refrescaBarra();                       // v3.21: cambiaste algo de mi sistema
          if(d.salvapantallas) setTimeout(function(){ refrescaBarra(); setTimeout(mostrarSalva, 600); }, 300);
        }
      }).catch(function(){});
    }, 350);
  }).catch(function(){ m.texto="No llego a Kira ahora mismo."; ocupada=false; pintaCharla(); quitaAviso(); });
}
$("enviar").onclick=function(){ enviar($("entrada").value); };
$("entrada").addEventListener("keydown", function(e){ if(e.key==="Enter") enviar(this.value); });
$("mic").onclick=function(){
  var mic=$("mic"); if(mic.classList.contains("oye")) return;
  mic.classList.add("oye"); aviso('<span class="puntos"><i></i><i></i><i></i></span>Te escucho… habla ahora');
  llama("escuchar").then(function(r){
    mic.classList.remove("oye"); quitaAviso();
    if(r && r.ok && r.texto){ enviar(r.texto); } else { aviso(esc((r&&r.error)||"No te he oído."), 5); }
  }).catch(function(){ mic.classList.remove("oye"); aviso("No puedo escuchar ahora.", 5); });
};
function abreCajon(si){ $("cajon").classList.toggle("on", si); $("btnTexto").classList.toggle("on", si);
  if(si){ $("btnTexto").classList.remove("nuevo"); pintaCharla(); } }
$("btnTexto").onclick=function(){ abreCajon(!$("cajon").classList.contains("on")); };
$("cajonCerrar").onclick=function(){ abreCajon(false); };
function pintaVoz(){
  $("icoVoz").innerHTML = vozOn ? '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a9 9 0 0 1 0 12"/>'
                                : '<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>';
  $("btnVoz").classList.toggle("on", vozOn);
  $("btnVoz").title = vozOn ? "Kira contesta con su voz (pulsa para que solo escriba)" : "Kira solo escribe (pulsa para que hable)";
}
$("btnVoz").onclick=function(){ vozOn=!vozOn; pintaVoz(); llama("voz_activa_poner", vozOn).catch(function(){}); };
$("wifi").onclick=function(){ abrir("wifi"); };

// ---------- menú KIRA (como el Inicio de Windows) ----------
var confirmar=null;
function pintaMenu(){
  $("menu").innerHTML='<div class="quien"><div class="mini"><b style="background:linear-gradient(100deg,#2ee6ff,#f472d0);-webkit-background-clip:text;background-clip:text;color:transparent">K</b></div>'+
    '<div><div style="font-weight:600">KiraOS</div><div style="color:var(--tenue);font-size:12px">'+esc($("hola").textContent)+'</div></div></div>'+
    ICONOS.map(function(i){ return '<div class="op" data-app="'+i.id+'">'+svg(i.id)+esc(i.titulo)+'</div>'; }).join("")+
    '<div class="sep"></div><div class="op" data-sis="bloquear">'+svg("bloquear")+'Volver al orbe</div>'+
    '<div class="op" data-sis="salir">'+svg("salir")+'Ir a Xubuntu</div>'+
    '<div class="op peligro" data-sis="reiniciar">'+svg("reiniciar")+(confirmar==="reiniciar"?"¿Seguro? Toca otra vez":"Reiniciar el portátil")+'</div>'+
    '<div class="op peligro" data-sis="apagar">'+svg("apagar")+(confirmar==="apagar"?"¿Seguro? Toca otra vez":"Apagar el portátil")+'</div>';
  [].forEach.call(document.querySelectorAll("#menu [data-app]"), function(el){ el.onclick=function(){ abrir(el.dataset.app); }; });
  [].forEach.call(document.querySelectorAll("#menu [data-sis]"), function(el){ el.onclick=function(){ sistema(el.dataset.sis); }; });
}
function sistema(a){
  if(a==="bloquear"){ location.href="arranque.html"; return; }
  if(a==="salir"){ cierraMenus(); llama("sistema", "salir").then(function(d){ aviso(esc((d&&d.texto)||""), 6); }).catch(function(){}); return; }
  if(confirmar!==a){ confirmar=a; pintaMenu(); setTimeout(function(){ if(confirmar===a){ confirmar=null; pintaMenu(); } }, 6000); return; }
  confirmar=null; cierraMenus();
  llama("sistema", a).then(function(d){ aviso(esc((d&&d.texto)||""), 6); }).catch(function(){});
}
function cierraMenus(){ $("menu").classList.remove("on"); $("btnKira").classList.remove("on"); }
$("btnKira").onclick=function(e){ e.stopPropagation(); var on=!$("menu").classList.contains("on");
  confirmar=null; pintaMenu(); $("menu").classList.toggle("on", on); $("btnKira").classList.toggle("on", on); };
$("menu").addEventListener("click", function(e){ e.stopPropagation(); });   // v2.98: un clic DENTRO del menú no lo cierra
document.addEventListener("click", function(e){ if(!$("menu").contains(e.target) && e.target!==$("btnKira")) cierraMenus(); });

// ---------- teclado: escribir en cualquier sitio = hablar con Kira; Esc = volver ----------
document.addEventListener("keydown", function(e){
  if(e.key==="Escape"){ if($("menu").classList.contains("on")) cierraMenus(); else if($("cajon").classList.contains("on")) abreCajon(false); else volver(); return; }
  var t=e.target, enCampo = t && (t.tagName==="INPUT" || t.tagName==="TEXTAREA");
  if(!enCampo && e.key.length===1 && !e.ctrlKey && !e.altKey && !e.metaKey){ $("entrada").focus(); }
});

// ---------- arranque ----------
$("trabParar").addEventListener("click", function(){
  llama("parar").then(function(r){ aviso(esc((r&&r.texto)||"He parado."), 4); refrescaTrabajo(); }).catch(function(){}); });
$("trabPausar").addEventListener("click", function(){
  llama("pausar_trabajo", !trabPausada).then(function(r){
    trabPausada=!!(r&&r.pausada); aviso(trabPausada?"En pausa. Pulsa «Seguir» cuando quieras.":"Sigo con lo que tenga.", 4);
    refrescaTrabajo(); }).catch(function(){}); });
pintaIconos(); pintaVoz(); reloj(); setInterval(reloj, 10000);
function empieza(){ if(empieza.hecho) return; empieza.hecho=true; refrescaBarra(); setInterval(refrescaBarra, 20000);
  pintaVersion(); setInterval(pintaVersion, 60000);
  refrescaTrabajo(); setInterval(refrescaTrabajo, 3000); }
if(window.pywebview && window.pywebview.api){ empieza(); }
else { window.addEventListener("pywebviewready", empieza); setTimeout(empieza, 400); }
</script>
