# Compila el APK de Kira en los servidores de GitHub (gratis). Tu PC solo sube la carpeta y descarga el resultado.
# Se lanza a mano (pestaña Actions > «Compilar APK de Kira» > Run workflow) o al subir cambios a main/master.
# El APK sale en: la ejecución > Artifacts > kira-apk.
name: Compilar APK de Kira

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Python 3.12 (el estable para buildozer en Ubuntu 24.04)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema (lista oficial de buildozer para 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libltdl-dev libssl-dev automake autopoint gettext

      - name: Buildozer y Cython fijado (los recipes no van con Cython 3)
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Incluir plyer (la voz) dentro del proyecto
        run: python herramientas_pc/incluir_plyer.py

      - name: Revisión previa (falla en segundos en vez de tras una hora)
        run: python herramientas_pc/comprobar_antes_de_compilar.py

      - name: Recuperar SDK/NDK guardados (acelera las siguientes compilaciones)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Compilar el APK (debug)
        run: |
          set -o pipefail
          # lo que quedó a medias de libffi en un intento anterior (si falló al prepararse)
          rm -rf .buildozer/android/platform/build-*/build/other_builds/libffi* || true
          # si cambió la rama de python-for-android en buildozer.spec, bajar la copia nueva
          if [ -d .buildozer/android/platform/python-for-android ]; then
            want=$(grep -E '^p4a.branch' buildozer.spec | cut -d= -f2 | tr -d ' ')
            have=$(git -C .buildozer/android/platform/python-for-android rev-parse --abbrev-ref HEAD 2>/dev/null || echo "?")
            if [ -n "$want" ] && [ "$want" != "$have" ]; then echo "p4a: $have -> $want"; rm -rf .buildozer/android/platform/python-for-android .buildozer/android/platform/build-*; fi
          fi
          yes | buildozer -v android debug 2>&1 | tee compilacion.log

      - name: Guardar SDK/NDK aunque falle (para no descargarlos otra vez)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - name: Si falló, resumir el error (Kira y Claude lo leen en las anotaciones)
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          try:
              lineas = open("compilacion.log", encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lineas = ["No se creó compilacion.log"]
          limpio = [re.sub(r"\x1b\[[0-9;]*m", "", l) for l in lineas]
          idx = [i for i, l in enumerate(limpio) if re.search(r"Command failed|Error:|ERROR:|error:|Traceback|BuildInterruptingException|No matching distribution|FAILED", l)]
          trozos = []
          for i in idx[-6:]:
              trozos.append("\n".join(limpio[max(0, i - 25): i + 8]))
          resumen = ("\n----\n".join(trozos) if trozos else "\n".join(limpio[-80:]))[-12000:]
          resumen += "\n==== FINAL DEL REGISTRO ====\n" + "\n".join(limpio[-40:])[-5000:]
          esc = resumen.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print("::error title=Fallo de buildozer::" + esc)
          PY

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: kira-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
