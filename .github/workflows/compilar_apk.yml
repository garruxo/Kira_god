# Compila el APK de Kira en los servidores de GitHub (gratis). Tu PC solo sube la carpeta y descarga el resultado.
# Se lanza a mano (pestaña Actions > «Compilar APK de Kira» > Run workflow) o al subir cambios a main/master.
# El APK sale en: la ejecución > Artifacts > kira-apk.
name: Compilar APK de Kira

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Python 3.12 (el estable para buildozer en Ubuntu 24.04)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Dependencias del sistema (lista oficial de buildozer para 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libltdl-dev libssl-dev automake autopoint gettext

      - name: Buildozer y Cython fijado (los recipes no van con Cython 3)
        run: |
          python -m pip install --upgrade pip
          pip install buildozer setuptools cython==0.29.34

      - name: Incluir plyer (voz de reserva) dentro del proyecto
        run: python herramientas_pc/incluir_plyer.py

      - name: Revisión previa (falla en segundos en vez de tras una hora)
        run: python herramientas_pc/comprobar_antes_de_compilar.py

      - name: Recuperar SDK/NDK guardados (acelera las siguientes compilaciones)
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Recuperar el cerebro ya compilado (si no ha cambiado)
        id: cache_cerebro
        uses: actions/cache@v4
        with:
          path: libs_android
          key: cerebro-${{ hashFiles('herramientas_pc/compilar_cerebro_android.sh') }}

      - name: Compilar el cerebro de Kira (llama.cpp para Android)
        if: steps.cache_cerebro.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash herramientas_pc/compilar_cerebro_android.sh 2>&1 | tee cerebro.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            python3 -c "import re;t=open('cerebro.log',errors='replace').read().splitlines();m=[l for l in t if re.search(r'error|Error|ERROR|No encuentro',l)][-25:];x='\n'.join(m+['---']+t[-30:])[-3800:];print('::error title=Fallo al compilar el cerebro::'+x.replace('%','%25').replace('\n','%0A'))"
            exit $rc
          fi

      - name: Recuperar el pintor ya compilado (si no ha cambiado)
        id: cache_pintor
        uses: actions/cache@v4
        with:
          path: libs_android/arm64-v8a/libkira_pintor*.so
          key: pintor-${{ hashFiles('herramientas_pc/compilar_pintor_android.sh') }}

      - name: Compilar el pintor de Kira (stable-diffusion.cpp para Android)
        if: steps.cache_pintor.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash herramientas_pc/compilar_pintor_android.sh 2>&1 | tee pintor.log; rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            python3 -c "import re;t=open('pintor.log',errors='replace').read().splitlines();m=[l for l in t if re.search(r'error|Error|ERROR|No encuentro',l)][-25:];x='\n'.join(m+['---']+t[-30:])[-3800:];print('::error title=Fallo al compilar el pintor::'+x.replace('%','%25').replace('\n','%0A'))"
            exit $rc
          fi

      - name: Compilar el APK (debug)
        run: |
          # lo que quedó a medias de libffi en un intento anterior (si falló al prepararse)
          rm -rf .buildozer/android/platform/build-*/build/other_builds/libffi* || true
          # si cambió la rama de python-for-android en buildozer.spec, bajar la copia nueva
          if [ -d .buildozer/android/platform/python-for-android ]; then
            want=$(grep -E '^p4a.branch' buildozer.spec | cut -d= -f2 | tr -d ' ')
            have=$(git -C .buildozer/android/platform/python-for-android rev-parse --abbrev-ref HEAD 2>/dev/null || echo "?")
            if [ -n "$want" ] && [ "$want" != "$have" ]; then echo "p4a: $have -> $want"; rm -rf .buildozer/android/platform/python-for-android .buildozer/android/platform/build-*; fi
          fi
          # el código de salida que cuenta es el de buildozer (el 2.º de la tubería), no el de «yes»
          yes | buildozer -v android debug 2>&1 | tee compilacion.log; rc=${PIPESTATUS[1]}
          ls -la bin/ || true
          exit $rc

      - name: Guardar SDK/NDK aunque falle (para no descargarlos otra vez)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-${{ github.run_id }}

      - name: Si falló, resumir el error (Kira y Claude lo leen en las anotaciones)
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          try:
              lineas = open("compilacion.log", encoding="utf-8", errors="replace").read().splitlines()
          except OSError:
              lineas = ["No se creó compilacion.log"]
          RUIDO = re.compile(r"Lib/test/|\*\*\* Error compiling|^\s*\^+\s*$|SyntaxError: (?:from __future__|unknown encoding|encoding problem|invalid|Non-UTF)|"
                             r"autoupdate|AC_[A-Z_]+|general\.m4|the top level|acinclude\.m4|libtool\.m4|^\s*File \".*Lib/test|Downloading .*eta|━━")
          limpio = [re.sub(r"\x1b\[[0-9;?]*[A-Za-z]", "", l).rstrip() for l in lineas]
          util = [l for l in limpio if l.strip() and not RUIDO.search(l)]
          def nota(titulo, texto):
              texto = texto[-3800:]
              print(f"::error title={titulo}::" + texto.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          nota("1 Final del registro", "\n".join(util[-70:]))
          idx = [k for k, l in enumerate(util) if re.search(r"Command failed|ERROR|Error:|error:|Traceback|Exception|FAILED|BUILD FAILED", l)]
          for n, k in enumerate(idx[-3:], 2):
              nota(f"{n} Error cerca de la linea {k}", "\n".join(util[max(0, k - 30): k + 10]))
          PY

      - name: Guardar el registro completo (descargable desde la ejecución)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-compilacion
          path: compilacion.log
          retention-days: 7

      - name: Comprobar qué lleva el APK (cerebro, oído, lector)
        run: |
          APK=$(ls bin/*.apk | head -1)
          LIBS=$(unzip -l "$APK" | grep -oE "lib/arm64-v8a/lib(kira_cerebro[a-z_]*|kira_pintor[a-z_]*|vosk|tesseract|leptonica|jnidispatch|pngx|jpeg)[a-z0-9_]*\.so" | sort -u | tr '\n' ' ')
          DEX=$(unzip -p "$APK" 'classes*.dex' | grep -a -oE "Lorg/vosk/android/SpeechService;|Lcom/googlecode/tesseract/android/TessBaseAPI;|Lorg/kira/servicio/ServicioKira;|Lorg/kira/servicio/CamaraKira;|Lorg/kira/servicio/VozKira;" | sort -u | tr '\n' ' ')
          TAM=$(du -h "$APK" | cut -f1)
          echo "::notice title=Contenido del APK::Tamaño $TAM. Librerías: $LIBS. Clases Java: $DEX"
          echo "$LIBS" | grep -q kira_cerebro || echo "::warning title=Falta el cerebro::El APK no lleva libkira_cerebro*.so"
          echo "$LIBS" | grep -q kira_pintor || echo "::warning title=Falta el pintor::El APK no lleva libkira_pintor*.so"
          echo "$DEX" | grep -q VozKira || echo "::warning title=Falta la voz::El APK no lleva VozKira: hablará con la voz antigua (lenta)"
          # el manifiesto: servicio «siempre activa», lista de apps (para «abre WhatsApp») y permiso de segundo plano
          AAPT=$(ls ~/.buildozer/android/platform/android-sdk/build-tools/*/aapt 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT" ]; then
            MAN=$("$AAPT" dump xmltree "$APK" AndroidManifest.xml 2>/dev/null || true)
            QUE=""
            echo "$MAN" | grep -q "ServicioKira" && QUE="$QUE servicio" || echo "::warning title=Manifiesto::Falta el servicio ServicioKira"
            echo "$MAN" | grep -q "E: queries" && QUE="$QUE lista-de-apps" || echo "::warning title=Manifiesto::Falta <queries>: Kira no podrá ver las apps instaladas"
            echo "$MAN" | grep -q "SYSTEM_ALERT_WINDOW" && QUE="$QUE abrir-desde-fondo" || echo "::warning title=Manifiesto::Falta el permiso SYSTEM_ALERT_WINDOW"
            echo "::notice title=Manifiesto del APK::Lleva:$QUE"
          else
            echo "::warning title=Manifiesto::No encuentro aapt para revisar el manifiesto"
          fi

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: kira-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30
