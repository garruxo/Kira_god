# Busca la firma con la que se han venido firmando los APK de Kira (la guarda la caché de buildozer) para seguir
# usándola: así la Kira instalada en el móvil se puede ACTUALIZAR sin desinstalar. Deja lo encontrado en la rama
# «firma-encontrada» (nunca toca main).
name: Buscar la firma de Kira

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/buscar_firma.yml"]

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-24.04
    steps:
      - name: Recuperar la caché de buildozer (la misma que usa la compilación)
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-no-existe
          restore-keys: buildozer-${{ runner.os }}-

      - name: Buscar firmas
        run: |
          mkdir -p salida
          i=0
          for f in $(find ~ "$GITHUB_WORKSPACE" -xdev \( -name "*.keystore" -o -name "*.jks" \) 2>/dev/null); do
            i=$((i+1))
            sha=$(keytool -list -v -keystore "$f" -storepass android 2>/dev/null | grep -m1 "SHA256:" | sed 's/.*SHA256: //' | tr -d ':' | tr 'A-F' 'a-f')
            echo "::notice title=Firma $i::$f -> ${sha:-no se pudo leer}"
            cp "$f" "salida/firma_$i.keystore"
            echo "$f $sha" >> salida/lista.txt
          done
          [ $i -gt 0 ] || echo "::warning title=Firma::No hay ninguna firma en la caché"
          env | grep -i "android" | sort > salida/entorno.txt || true

      - name: Publicar en la rama «firma-encontrada»
        run: |
          cd salida
          git init -q && git checkout -q -b firma-encontrada
          git add -A
          git -c user.name="kira-firma" -c user.email="kira-firma@users.noreply.github.com" commit -q -m "Firmas encontradas en la caché"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" firma-encontrada
